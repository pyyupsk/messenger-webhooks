name: 🚀 Publish Release
on:
  workflow_run:
    workflows: ['⚙️ CI']
    branches:
      - main
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: ⬇️ Checkout repository
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        name: 🛠️ Setup bun
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: 📦 Setup Node.js
        with:
          node-version: 23
      - name: 🔍 Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: 🏗 Build project
        run: bun run --filter=@pyyupsk/messenger-webhooks build
      - name: 📋 Copy files
        run: |
          cp CHANGELOG.md packages/messenger-webhooks/
          cp CONTRIBUTING.md packages/messenger-webhooks/
          cp LICENSE packages/messenger-webhooks/
          cp README.md packages/messenger-webhooks/
      - name: 🚀 Publish release
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
