name: 🚀 Publish Release
on:
  workflow_run:
    workflows: ['⚙️ CI']
    branches:
      - main
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        name: ⬇️ Checkout repository
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        name: 🛠️ Setup bun
        with:
          bun-version: latest
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        name: 📦 Setup Node.js
        with:
          node-version: 23
      - name: 🔍 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🏗 Build project
        run: bun run --filter=@pyyupsk/messenger-webhooks build
      - name: 📋 Copy files
        run: |
          cp CHANGELOG.md packages/messenger-webhooks/
          cp CONTRIBUTING.md packages/messenger-webhooks/
          cp LICENSE packages/messenger-webhooks/
          cp README.md packages/messenger-webhooks/
      - name: 🚀 Publish release
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
